plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.chimera'
    compileSdk 35

    defaultConfig {
        applicationId "com.chimera"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a"
            universalApk false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.google.guava:guava:32.1.2-android'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.7'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.android.gms:play-services-location:21.2.0'
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    // WebRTC native lib optional - skeleton transport uses Firestore signaling only, no native dep needed for build
    // implementation 'org.webrtc:google-webrtc:1.0.32006' // removed to fix missing artifact, enable when native P2P needed
}